name: CI

on:
  push:
    branches:
      - release
    tags:
      - "v*"
  pull_request:
    branches:
      - release

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            9.0.x
            8.0.x

      - name: Restore
        run: dotnet restore ./TcknVkn.sln

      - name: Build
        run: dotnet build ./TcknVkn.sln -c Release --no-restore

      - name: Test
        run: dotnet test ./tests/TcknVkn.Tests/TcknVkn.Tests.csproj -c Release --no-build --verbosity normal

      - name: Pack
        run: dotnet pack ./TcknVkn/TcknVkn.csproj -c Release --no-build -o ./artifacts

  verify-tag-on-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: test-and-build
    runs-on: ubuntu-latest
    outputs:
      is_stable: ${{ steps.tag-bicimi.outputs.is_stable }}
      is_beta: ${{ steps.tag-bicimi.outputs.is_beta }}

    steps:
      # Etiket bicimi kapisi — on surumun kararli kanala sizmasini engeller.
      # GitHub Actions `if:` ifadelerinde regex yoktur; siniflandirma burada
      # yapilir ve yayin isleri yalnizca bu ciktilara bakar.
      #   vX.Y.Z         -> kararli
      #   vX.Y.Z-<onek>  -> on surum (-alpha, -beta, -rc, -preview, -dev ...)
      #   digerleri      -> FAIL (hicbir kanala gitmez)
      - name: Etiket bicimini siniflandir
        id: tag-bicimi
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_stable=true" >> "$GITHUB_OUTPUT"
            echo "is_beta=false" >> "$GITHUB_OUTPUT"
            echo "Kararli surum etiketi: $TAG"
          elif [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.-]+$ ]]; then
            echo "is_stable=false" >> "$GITHUB_OUTPUT"
            echo "is_beta=true" >> "$GITHUB_OUTPUT"
            echo "On surum etiketi: $TAG"
          else
            echo "::error::Gecersiz etiket bicimi: $TAG"
            echo "Beklenen: vX.Y.Z (kararli) veya vX.Y.Z-<onek> (on surum)"
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify tag commit is on release branch
        run: |
          git fetch origin release --depth=1
          if git merge-base --is-ancestor "$GITHUB_SHA" "origin/release"; then
            echo "Tag commit is on release branch."
          else
            echo "Tag must be created from release branch commit."
            exit 1
          fi

  publish-beta:
    if: needs.verify-tag-on-release.outputs.is_beta == 'true'
    needs:
      - test-and-build
      - verify-tag-on-release
    runs-on: ubuntu-latest
    environment: nuget-beta
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            9.0.x
            8.0.x

      - name: Restore
        run: dotnet restore ./TcknVkn.sln

      - name: Build
        run: dotnet build ./TcknVkn.sln -c Release --no-restore

      - name: Test
        run: dotnet test ./tests/TcknVkn.Tests/TcknVkn.Tests.csproj -c Release --no-build --verbosity normal

      - name: Pack prerelease
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          dotnet pack ./TcknVkn/TcknVkn.csproj -c Release --no-build -o ./artifacts /p:PackageVersion=$VERSION

      - name: Publish to NuGet (beta)
        run: dotnet nuget push "./artifacts/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source "https://api.nuget.org/v3/index.json" --skip-duplicate

  publish-stable:
    if: needs.verify-tag-on-release.outputs.is_stable == 'true'
    needs:
      - test-and-build
      - verify-tag-on-release
    runs-on: ubuntu-latest
    environment: nuget-production
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            9.0.x
            8.0.x

      - name: Restore
        run: dotnet restore ./TcknVkn.sln

      - name: Build
        run: dotnet build ./TcknVkn.sln -c Release --no-restore

      - name: Test
        run: dotnet test ./tests/TcknVkn.Tests/TcknVkn.Tests.csproj -c Release --no-build --verbosity normal

      - name: Pack stable
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          dotnet pack ./TcknVkn/TcknVkn.csproj -c Release --no-build -o ./artifacts /p:PackageVersion=$VERSION

      - name: Publish to NuGet (stable)
        run: dotnet nuget push "./artifacts/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source "https://api.nuget.org/v3/index.json" --skip-duplicate

  release-beta:
    if: needs.verify-tag-on-release.outputs.is_beta == 'true'
    needs:
      - publish-beta
      - verify-tag-on-release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Create GitHub release (beta)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: true
          generate_release_notes: true

  release-stable:
    if: needs.verify-tag-on-release.outputs.is_stable == 'true'
    needs:
      - publish-stable
      - verify-tag-on-release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: false
          generate_release_notes: true

  # Golden dataset tcknvkn/spec reposundan kopyalanmistir; ELLE DUZENLENMEZ.
  # Kopyalanan dosya zamanla sessizce ayrisir - biri duzeltilir, on sekizi eski
  # kalir. Bu kapi farki merge aninda yakalar.
  #
  # Dataset guncellendiginde: once tcknvkn/spec reposunda yeni surum etiketlenir,
  # sonra buradaki dosya ve asagidaki hash birlikte guncellenir.
  golden-dataset:
    runs-on: ubuntu-latest
    env:
      # tcknvkn/spec @ spec-v1.0.0
      GOLDEN_SHA256: e472cca15d825160877053da1e6e7078e8c1c18ef32fa25f5abb100bef217df9
    steps:
      - uses: actions/checkout@v5

      - name: Kopya kanonik surumle ayni mi
        run: |
          if ! echo "${GOLDEN_SHA256}  tests/golden-dataset.json" | sha256sum -c - ; then
            echo "::error::tests/golden-dataset.json kanonik surumden farkli."
            echo "beklenen: ${GOLDEN_SHA256}"
            echo "bulunan : $(sha256sum tests/golden-dataset.json | awk '{print $1}')"
            echo "kanonik kaynak: https://github.com/tcknvkn/spec (spec-v1.0.0)"
            exit 1
          fi
